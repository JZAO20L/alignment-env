[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alignment-env"
version = "0.1.0"
description = "OpenEnv-based red-blue model-alignment attack-defense training environment"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "modelscope>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
ui = ["gradio>=4"]
web = ["fastapi>=0.100", "uvicorn>=0.20"]
openenv = ["openenv>=0.10.0"]  # 可选：OpenEnv 播放器/部署到 HF Space。默认不装（transport-free 壳不需要）

[project.scripts]
alignment-env = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["models", "cli", "obs", "envs", "envs.red_blue_env", "webui", "server"]